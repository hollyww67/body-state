name: Public site editorial and shop guard QA (no deployment)

on:
  pull_request:
    branches: [feat/admin-premium-healthcare-v3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install exactly locked packages
        run: npm ci --no-audit --no-fund
      - name: Offline store visibility integration contracts
        run: node tests/site-visibility.cjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npx eslint src
      - name: Production build (never deploy)
        run: npm run build
